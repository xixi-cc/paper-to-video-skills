name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Validate Skills and UI metadata
        run: python scripts/validate_skills.py

      - name: Compile Python sources
        run: python scripts/check_python_syntax.py

      - name: Run regression tests
        run: python -m unittest discover -s tests -q

      - name: Check shell syntax
        run: bash -n pdf-slides-to-video/scripts/setup_indextts2_runtime.sh

      - name: Check local Markdown links
        run: python scripts/check_markdown_links.py
